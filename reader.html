<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manga Reader</title>
  <link rel="icon" type="image/png" href="icon/LOGO.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="reader-body">

  <div id="loading-screen" class="loading-overlay">
    <div class="loading-content">
      <div id="loading-text">กำลังโหลดเนื้อหา... (0%)</div>
      
      <img id="loading-icon" src="icon/loading.gif" alt="Loading..." />
    </div>
  </div>

  <div class="audio-controls">
    <select id="chapter-select" class="control-select" onchange="changeChapter(this.value)"></select>
    <button id="mute-btn" class="control-btn">🔊 เปิดเสียงอยู่</button>
    <a href="index.html" class="control-btn back-btn">⬅️ หน้าแรก</a>
  </div>

  <main class="manga-container" id="flip-mode-container">
    <div class="manga-page-wrapper" id="page-click-area">
      <img id="current-manga-img" src="" alt="Manga Page">
    </div>

    <div class="page-controls">
      <button id="prev-btn" class="nav-btn">◀ หน้าก่อนหน้า</button>
      <span id="page-indicator">หน้า 1 / 1</span>
      <button id="next-btn" class="nav-btn">หน้าถัดไป ▶</button>
    </div>
  </main>

  <main class="manga-scroll-container hidden" id="scroll-mode-container"></main>

  <script src="reader.js"></script>
</body>
</html>
